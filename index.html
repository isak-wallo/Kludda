<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" href="icon-192.png">
    <title>Kludd</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="start-overlay">
    <button id="start-btn">BÖRJA KLUDDA</button>
</div>

<div id="app">
<div id="canvas-container">
    <canvas id="viewCanvas"></canvas>
</div>

<div id="button-container">
    <!-- Färgerna (mjuka toner som Poppas ballonger, lite djupare så de syns
         på vitt papper) står bara i data-color — app.js färgar rutorna. -->
    <div class="color-box c-svart selected" data-color="#4a4e5a"></div>
    <div class="color-box c-rod"   data-color="#ec8a8a"></div>
    <div class="color-box c-gul"   data-color="#f2c55e"></div>
    <div class="color-box c-bla"   data-color="#6f9fe0"></div>
    <div class="color-box c-gron"  data-color="#8fcb86"></div>
    <div class="color-box c-lila"  data-color="#b394dc"></div>
    <button id="undo-btn" class="sys-btn" disabled>ÅNGRA</button>
    <button id="clear-btn" class="sys-btn">RENSA</button>
</div>
</div>

<script src="app.js" defer></script>
</body>
</html>
